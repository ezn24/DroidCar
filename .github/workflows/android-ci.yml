name: Build Signed Neo APK

on:
  push:
    branches: [neo]
    # Changes to files/design drafts only do not produce a build: skipped only when **all** files in the push match the rules below;
    # any code/resource change mixed in builds as usual. Can be run manually via workflow_dispatch when needed.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - 'LICENSE'
      - 'keystore.properties.example'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    if: github.ref == 'refs/heads/neo'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.name }}
      apk: ${{ steps.package.outputs.name }}
      sha: ${{ steps.package.outputs.sha }}
      cert: ${{ steps.package.outputs.cert }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Build number = commit count (git rev-list --count HEAD), which needs the full history
          fetch-depth: 0

      # AGP 8.7 requires JDK 17, consistent with jvmTarget in app/build.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: bash ./gradlew :app:testStandardDebugUnitTest :app:lintStandardDebug --stacktrace

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          BASE=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$BASE" || { echo "::error::cannot read appVersionName from app/build.gradle.kts"; exit 1; }
          # The build number is the commit count rather than run_number: the same commit gets the same version locally and in CI,
          # and it increases monotonically with commits (run_number does not match local manual build numbers, so the CI package could be smaller than the one installed locally and fail to install)
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          VERSION="${BASE}.${BUILD_NUMBER}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version for this run: $VERSION (versionCode = base*10000 + ${BUILD_NUMBER})"

      - name: Build signed APK
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret:-}" ]]; then
              echo "::error::Missing Actions secret: $secret"
              exit 1
            fi
          done

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/cardeck-signing.XXXXXX")
          trap 'rm -f -- keystore.properties "$signing_dir/release.jks"; rmdir -- "$signing_dir"' EXIT
          export CARDECK_SIGNING_DIR="$signing_dir"

          python3 - <<'PYTHON'
          import base64
          import os
          from pathlib import Path

          keystore = Path(os.environ["CARDECK_SIGNING_DIR"]) / "release.jks"
          encoded = "".join(os.environ["KEYSTORE_BASE64"].split())
          keystore.write_bytes(base64.b64decode(encoded, validate=True))

          def java_property(value):
              # Properties.load(InputStream) interprets backslashes and reads Latin-1.
              units = value.encode("utf-16-be")
              return "".join(r"\u" + units[i:i + 2].hex() for i in range(0, len(units), 2))

          properties = {
              "storeFile": str(keystore),
              "storePassword": os.environ["KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "keyPassword": os.environ["KEY_PASSWORD"],
          }
          Path("keystore.properties").write_text(
              "".join(f"{key}={java_property(value)}\n" for key, value in properties.items()),
              encoding="ascii",
          )
          PYTHON

          unset KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          bash ./gradlew :app:assembleStandardRelease "-Pcardeck.buildNumber=$BUILD_NUMBER" --stacktrace

      - name: Verify signature and package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.name }}
          EXPECTED_CERT: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/standard/release/app-standard-release.apk
          test -f "$APK" || { echo "::error::$APK not found"; exit 1; }

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt

          # A keystore was configured but the certificate is still debug = keystore.properties was not read; it must never be released
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::artifact is debug-signed: the release signing config did not take effect (check keystore.properties and the storeFile path)"
            exit 1
          fi
          CERT=$(grep "certificate SHA-256 digest" certs.txt | head -n1 | sed 's/.*digest: //')
          test -n "$CERT" || { echo "::error::cannot read the signing certificate fingerprint"; exit 1; }

          if [ -n "${EXPECTED_CERT:-}" ]; then
            EXPECTED=$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')
            ACTUAL=$(printf '%s' "$CERT" | tr -d ': ' | tr 'A-F' 'a-f')
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::signing certificate does not match EXPECTED_CERT_SHA256: expected $EXPECTED, actual $ACTUAL"
              exit 1
            fi
            echo "signing certificate matches EXPECTED_CERT_SHA256"
          fi

          NAME="CarDeck-Neo-${VERSION}-release.apk"
          cp "$APK" "$NAME"
          SHA=$(sha256sum "$NAME" | cut -d' ' -f1)
          SIZE=$(du -h "$NAME" | cut -f1)
          {
            echo "name=$NAME"
            echo "sha=$SHA"
            echo "cert=$CERT"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"
          echo "Generated $NAME ($SIZE)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error
          retention-days: 30
          overwrite: 'true' # Re-running the same run keeps the version number, so the old artifact is overwritten instead of failing

      - name: Write run summary
        env:
          VERSION: ${{ steps.version.outputs.name }}
          NAME: ${{ steps.package.outputs.name }}
          SHA: ${{ steps.package.outputs.sha }}
          CERT: ${{ steps.package.outputs.cert }}
          SIZE: ${{ steps.package.outputs.size }}
        run: |
          set -euo pipefail
          {
            echo "### CarDeck Neo ${VERSION} (release signed)"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| APK | ${NAME} |"
            echo "| APK size | ${SIZE} |"
            echo "| SHA-256 | ${SHA} |"
            echo "| Signing certificate SHA-256 | ${CERT} |"
            echo
            echo "Install: adb install -r ${NAME}"
            echo
            echo "> The size shown in the Artifacts list is the **zipped** size (dex is stored uncompressed inside the APK, so re-zipping shrinks it to about 45%);"
            echo "> The unzipped APK size is in the table above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports (to help diagnose failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish signed APK
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Release notes are generated from the commit messages between the previous Release's tag and this commit, so the full history and tags are needed
      - name: Check out source (for generating release notes)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          path: src

      - name: Download the verified APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          APK: ${{ needs.build.outputs.apk }}
          APK_SHA256: ${{ needs.build.outputs.sha }}
          CERT_SHA256: ${{ needs.build.outputs.cert }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$APK_SHA256" "$APK" | sha256sum --check
          TAG="v${VERSION}"
          if gh release view "$TAG" --json isDraft,assets --jq ".isDraft == false and any(.assets[]; .name == \"$APK\")" | grep -qx true; then
            echo "Release $TAG published"
            exit 0
          fi
          # The previous published version (not this one): release notes = all commits between it and this commit
          PREV=$(gh release list --limit 20 --json tagName,isDraft --jq "[.[] | select(.isDraft | not) | .tagName | select(. != \"$TAG\")][0] // empty")
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "## What's changed"
            echo
            if [ -n "$PREV" ] && git -C src rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
              RANGE="$PREV..$GITHUB_SHA"
            else
              RANGE="$GITHUB_SHA"
            fi
            # For each commit: the subject becomes a section, the body is kept verbatim; trailers such as Co-Authored-By are stripped
            git -C src log --no-merges --reverse --format='%x1e%s%x1f%b' "$RANGE" -n 50 |
              python3 -c '
          import sys
          for record in sys.stdin.read().split("\x1e"):
              if not record.strip():
                  continue
              subject, _, body = record.partition("\x1f")
              lines = [l for l in body.strip().splitlines() if not l.lower().startswith(("co-authored-by:", "signed-off-by:"))]
              print("### " + subject.strip())
              text = "\n".join(lines).strip()
              if text:
                  print()
                  print(text)
              print()
          '
            if [ -n "$PREV" ]; then
              printf '**Full changelog**: https://github.com/%s/compare/%s...%s\n\n' "$GH_REPO" "$PREV" "$TAG"
            fi
            echo "## Download and verify"
            echo
            printf 'Release-signed APK: `%s`\n\n' "$APK"
            printf -- '- APK SHA-256: `%s`\n' "$APK_SHA256"
            printf -- '- Signing certificate SHA-256: `%s`\n' "$CERT_SHA256"
          } > "$NOTES"
          cat "$NOTES"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
            --title "CarDeck Neo $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
